# Throw-away PostgreSQL for tests/integration_db (port 5433 so it never clashes
# with your dev database on 5432).
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_marketplace_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: fast, and nothing to clean up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_marketplace_test"]
      interval: 2s
      timeout: 3s
      retries: 20
