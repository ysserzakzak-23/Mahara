[pytest]
testpaths = tests
addopts = -ra -q
# Deprecations stay visible: pytest shows DeprecationWarning by default, so
# one raised by our own code appears in the warnings summary instead of being
# swallowed. Only specific third-party noise is filtered, each with the pin
# that causes it, so the list can be revisited when a pin moves.
filterwarnings =
    # python-jose 3.3.0 calls datetime.utcnow() on every token decode
    # (jose/jwt.py:311) — about 380 times across this suite. Fixed only in a
    # newer python-jose, and the version is pinned in requirements.txt, so
    # there is nothing to fix on our side until that pin changes.
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:jose\.jwt
